<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>protogine</title>
  <style>
    html, body, canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: absolute;
      background: black;
      z-index: 0;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <script>
    // Browsers keep audio suspended until the player interacts with the page. Track every
    // AudioContext the game creates (kira's, through cpal) and resume it on each gesture.
    (() => {
      const Base = window.AudioContext || window.webkitAudioContext;
      if (!Base) return;
      const contexts = [];
      window.AudioContext = class extends Base {
        constructor(...args) {
          super(...args);
          contexts.push(this);
        }
      };
      const resume = () => {
        for (const context of contexts) {
          if (context.state === "suspended") context.resume();
        }
      };
      for (const type of ["pointerdown", "keydown", "touchend"]) {
        addEventListener(type, resume, { capture: true });
      }
    })();
  </script>

  <!-- miniquad's loader, vendored from miniquad 0.4.11 (commit 4f13d4a). Supplies the `env` imports and load(). -->
  <script src="gl.js"></script>

  <script type="module">
    // game.js is wasm-bindgen's glue, patched by `cargo xtask web` so gl.js owns instantiation.
    import { bindgenImports, attachBindgen } from "./game.js";

    // Save files (pg.filesystem) live in IndexedDB, keyed by "identity/path", with directories
    // as "identity/path/". The engine's file API is synchronous, so every file is loaded before
    // the game starts. Writes update this copy right away, then IndexedDB in the background.
    async function openSaves() {
      const files = new Map();
      let db = null;
      const done = (request) => new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      try {
        const open = indexedDB.open("protogine", 1);
        open.onupgradeneeded = () => open.result.createObjectStore("files");
        db = await done(open);
        const store = db.transaction("files").objectStore("files");
        const [keys, values] = await Promise.all([done(store.getAllKeys()), done(store.getAll())]);
        keys.forEach((key, i) => files.set(key, values[i]));
      } catch (error) {
        console.warn("protogine: saves won't persist, since IndexedDB is unavailable:", error);
        db = null;
      }
      const persist = (update) => {
        if (!db) return;
        const transaction = db.transaction("files", "readwrite");
        transaction.onerror = () => console.error("protogine: couldn't save:", transaction.error);
        update(transaction.objectStore("files"));
      };
      return {
        keys: () => [...files.keys()],
        read: (key) => files.get(key)?.data,
        size: (key) => files.get(key)?.data.length,
        modtime: (key) => files.get(key)?.modtime,
        write(key, data) {
          // `data` is a view into wasm memory, which can move, so copy it.
          const entry = { data: data.slice(), modtime: Date.now() / 1000 };
          files.set(key, entry);
          persist((store) => store.put(entry, key));
        },
        remove(key) {
          files.delete(key);
          persist((store) => store.delete(key));
        },
      };
    }
    // pg.system's browser side. A page can only read the clipboard when the player pastes into
    // it, so this keeps the text last pasted or set.
    function openSystem(battery) {
      let clipboard = "";
      addEventListener("paste", (event) => {
        clipboard = event.clipboardData?.getData("text/plain") ?? clipboard;
      });
      // The older way to copy, for when the Clipboard API is missing (over plain http) or
      // refuses: fill in the copy event that execCommand fires.
      const copyWithCommand = (text) => {
        const copy = (event) => {
          event.clipboardData.setData("text/plain", text);
          event.preventDefault();
          event.stopImmediatePropagation();
        };
        addEventListener("copy", copy, { capture: true });
        try {
          return document.execCommand("copy");
        } finally {
          removeEventListener("copy", copy, { capture: true });
        }
      };
      return {
        processorCount: () => navigator.hardwareConcurrency ?? 1,
        getClipboardText: () => clipboard,
        setClipboardText(text) {
          clipboard = text;
          // Browsers only allow copying shortly after a click or key press.
          const fallback = () => {
            if (!copyWithCommand(text)) console.warn("protogine: the browser refused to copy");
          };
          if (navigator.clipboard) navigator.clipboard.writeText(text).catch(fallback);
          else fallback();
        },
        openURL(url) {
          // Browsers block this as a popup unless it follows a click or key press.
          const opened = window.open(url, "_blank");
          if (opened) opened.opener = null;
          return opened != null;
        },
        vibrate(milliseconds) {
          navigator.vibrate?.(milliseconds);
        },
        // Only Chromium-based browsers have the Battery Status API.
        battery: () => battery && [
          battery.charging ? 1 : 0, battery.level, battery.chargingTime, battery.dischargingTime,
        ],
      };
    }

    const [saves, battery] = await Promise.all([
      openSaves(),
      navigator.getBattery?.().catch(() => null),
    ]);
    window.protogineSaves = saves;
    window.protogineSystem = openSystem(battery);

    const imports = bindgenImports();

    miniquad_add_plugin({
      name: "wasm_bindgen",
      version: 1,
      register_plugin(importObject) {
        Object.assign(importObject, imports);
        // gl.js warns about every import missing from `env`, including wasm-bindgen's.
        for (const module of Object.values(imports)) {
          for (const [name, fn] of Object.entries(module)) importObject.env[name] ??= fn;
        }
      },
      on_init() {
        attachBindgen(wasm_exports);
      },
    });

    load("game_bg.wasm");
  </script>
</body>
</html>
