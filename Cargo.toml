[package]
name = "protogine-v2"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]

[dependencies]
macroquad = "0.4.16"
kira = "0.12.4"
luars = "0.26.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Calls into web/index.html. Keep it at the version in Cargo.lock that wasm-bindgen-cli matches.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"

# Platform APIs for pg.system. miniquad already builds winapi, and chrono core-foundation-sys.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["combaseapi", "objbase", "shellapi", "winbase", "winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
