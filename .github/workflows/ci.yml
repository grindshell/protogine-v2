name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libx11-dev libxi-dev libgl1-mesa-dev \
            libgl1-mesa-dri libxkbcommon0 xvfb xauth
      - uses: Swatinem/rust-cache@v2
      # The Lua regression tests open windows, so they run on Linux only, under a virtual X
      # display with Mesa's software OpenGL. There's no sound card, so the audio suite skips
      # itself. Windows and macOS runners have no usable OpenGL, so they build everything and
      # run the unit tests.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --workspace --locked
      - name: Test (unit tests only)
        if: runner.os != 'Linux'
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked --bins

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-cli has to match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Find the wasm-bindgen version
        id: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: cargo xtask web --release --game games/demo
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: target/web
          retention-days: 7
